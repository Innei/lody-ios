name: TestFlight (iOS)

on:
  workflow_call:
    inputs:
      notes:
        required: false
        type: string
        default: ''
      runtime_fingerprint:
        required: false
        type: string
        default: ''
  workflow_dispatch:
    inputs:
      notes:
        description: 'Optional notification notes'
        required: false
        type: string

concurrency:
  group: testflight
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

env:
  MOBILE_DIR: apps/mobile
  APPLE_TEAM_ID: KAMM5N88X3
  LODY_BUNDLE_ID: app.innei.lody
  IOS_PROFILE_NAME: Lody App Store
  ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
  ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
  ASC_BYPASS_KEYCHAIN: '1'

jobs:
  submit:
    name: Archive and upload
    runs-on: macos-26
    timeout-minutes: 120
    outputs:
      build_number: ${{ steps.build.outputs.build_number }}
      marketing_version: ${{ steps.build.outputs.marketing_version }}
      fingerprint: ${{ steps.fp.outputs.hash }}
      source_short: ${{ steps.meta.outputs.source_short }}
    steps:
      - uses: actions/checkout@v6

      - name: Record commit
        id: meta
        run: echo "source_short=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install asc
        uses: rudrankriyam/setup-asc@5358c70a27a3f0d1517604b0f1fdc43e70c1cc4d # v1
        with:
          version: 4.11.0

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native runtime assets
        working-directory: ${{ env.MOBILE_DIR }}
        run: pnpm native:assets

      - name: Compute and verify fingerprint
        id: fp
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          EXPECTED: ${{ inputs.runtime_fingerprint }}
        run: |
          set -euo pipefail
          hash="$(../../node_modules/.bin/fingerprint fingerprint:generate --platform ios | jq -r .hash)"
          if [[ ! "$hash" =~ ^[a-zA-Z0-9]{16,}$ ]]; then
            echo "::error::Could not compute iOS fingerprint."
            exit 1
          fi
          if [ -n "$EXPECTED" ] && [ "$hash" != "$EXPECTED" ]; then
            echo "::error::Ship fingerprint $EXPECTED does not match archive fingerprint $hash."
            exit 1
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "EXPO_UPDATES_FINGERPRINT_OVERRIDE=$hash" >> "$GITHUB_ENV"
          echo "iOS runtime fingerprint $hash"

      - name: Prepare App Store Connect authentication
        env:
          ASC_API_KEY_P8: ${{ secrets.ASC_API_KEY_P8 }}
        run: |
          : "${ASC_KEY_ID:?ASC_KEY_ID is required}"
          : "${ASC_ISSUER_ID:?ASC_ISSUER_ID is required}"
          : "${ASC_API_KEY_P8:?ASC_API_KEY_P8 is required}"
          key_path="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s' "$ASC_API_KEY_P8" > "$key_path"
          chmod 600 "$key_path"
          echo "ASC_KEY_PATH=$key_path" >> "$GITHUB_ENV"
          echo "ASC_PRIVATE_KEY_PATH=$key_path" >> "$GITHUB_ENV"

      - name: Resolve version and build number
        id: build
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          set -euo pipefail
          marketing_version="$(npx expo config --json | jq -r '.version // empty')"
          if [[ ! "$marketing_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Expo config produced invalid marketing version: $marketing_version"
            exit 1
          fi
          build_number="$(asc builds next-build-number \
            --app "$LODY_BUNDLE_ID" \
            --version "$marketing_version" \
            --platform IOS \
            | jq -r .nextBuildNumber)"
          if [[ ! "$build_number" =~ ^[0-9]+$ ]]; then
            echo "::error::App Store Connect did not return a build number for $marketing_version."
            exit 1
          fi
          {
            echo "MARKETING_VERSION=$marketing_version"
            echo "BUILD_NUMBER=$build_number"
          } >> "$GITHUB_ENV"
          {
            echo "marketing_version=$marketing_version"
            echo "build_number=$build_number"
          } >> "$GITHUB_OUTPUT"
          echo "Building $marketing_version ($build_number)"

      - name: Generate native iOS project
        working-directory: ${{ env.MOBILE_DIR }}
        run: npx expo prebuild --platform ios --non-interactive --no-install

      - name: Stamp build number
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          set -euo pipefail
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $BUILD_NUMBER" ios/Lody/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' ios/Lody/Info.plist)" = "$BUILD_NUMBER"

      - name: Install CocoaPods
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          set -euo pipefail
          if command -v brew >/dev/null 2>&1 && brew --prefix ruby >/dev/null 2>&1; then
            PATH="$(brew --prefix ruby)/bin:$PATH"
            export PATH
          fi
          bundle config set --local path 'vendor/bundle'
          bundle install
          cd ios
          bundle exec pod install

      - name: Import distribution certificate
        env:
          DIST_CERT_P12: ${{ secrets.IOS_DIST_CERT_P12 }}
          DIST_CERT_PASSWORD: ${{ secrets.IOS_DIST_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          : "${DIST_CERT_P12:?IOS_DIST_CERT_P12 is required}"
          : "${DIST_CERT_PASSWORD:?IOS_DIST_CERT_PASSWORD is required}"
          keychain_path="$RUNNER_TEMP/ci.keychain-db"
          keychain_password="$(uuidgen)"
          security create-keychain -p "$keychain_password" "$keychain_path"
          security set-keychain-settings -lut 21600 "$keychain_path"
          security unlock-keychain -p "$keychain_password" "$keychain_path"
          security list-keychains -d user -s "$keychain_path" login.keychain-db
          printf '%s' "$DIST_CERT_P12" | base64 --decode > "$RUNNER_TEMP/dist.p12"
          security import "$RUNNER_TEMP/dist.p12" \
            -k "$keychain_path" \
            -P "$DIST_CERT_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security \
            -T /usr/bin/codesign_allocate
          security set-key-partition-list -S apple-tool:,apple: -s -k "$keychain_password" "$keychain_path" > /dev/null
          identities="$(security find-identity -v -p codesigning "$keychain_path")"
          printf '%s\n' "$identities"
          grep -q 'Apple Distribution:' <<< "$identities"

      - name: Install provisioning profile
        run: |
          set -euo pipefail
          profile_id="$(asc profiles list --paginate --output json \
            | jq -r --arg name "$IOS_PROFILE_NAME" \
              '[.data[] | select(.attributes.name == $name and .attributes.profileState == "ACTIVE")][0].id // ""')"
          if [ -z "$profile_id" ]; then
            echo "::error::No active App Store profile named '$IOS_PROFILE_NAME' in App Store Connect."
            exit 1
          fi
          profile="$RUNNER_TEMP/lody.mobileprovision"
          asc profiles download --id "$profile_id" --output "$profile"
          plist="$RUNNER_TEMP/lody-profile.plist"
          security cms -D -i "$profile" > "$plist"
          uuid="$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$plist")"
          app_id="$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$plist")"
          test "$app_id" = "$APPLE_TEAM_ID.$LODY_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:get-task-allow' "$plist")" = 'false'
          for dir in "$HOME/Library/MobileDevice/Provisioning Profiles" \
                     "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"; do
            mkdir -p "$dir"
            cp "$profile" "$dir/$uuid.mobileprovision"
          done
          echo "IOS_PROFILE_UUID=$uuid" >> "$GITHUB_ENV"
          echo "Installed $IOS_PROFILE_NAME ($uuid)"

      - name: Apply App target manual signing
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          set -euo pipefail
          node <<'NODE'
          const { IOSConfig } = require('expo/config-plugins');
          const { writeFileSync } = require('node:fs');
          const { APPLE_TEAM_ID, LODY_BUNDLE_ID, IOS_PROFILE_UUID } = process.env;
          if (!APPLE_TEAM_ID || !LODY_BUNDLE_ID || !IOS_PROFILE_UUID) {
            throw new Error('Team, bundle ID and installed profile UUID are required');
          }
          const project = IOSConfig.XcodeUtils.getPbxproj(process.cwd());
          const unquote = (value) => String(value).replace(/^"|"$/g, '');
          let patched = 0;
          for (const config of Object.values(project.pbxXCBuildConfigurationSection())) {
            const settings = config?.buildSettings;
            if (unquote(config?.name) !== 'Release' ||
                unquote(settings?.PRODUCT_BUNDLE_IDENTIFIER) !== LODY_BUNDLE_ID) continue;
            Object.assign(settings, {
              CODE_SIGN_STYLE: 'Manual',
              CODE_SIGN_IDENTITY: '"Apple Distribution"',
              DEVELOPMENT_TEAM: APPLE_TEAM_ID,
              PROVISIONING_PROFILE_SPECIFIER: `"${IOS_PROFILE_UUID}"`,
            });
            patched++;
          }
          if (patched !== 1) throw new Error(`Expected one Lody Release configuration, found ${patched}`);
          writeFileSync(project.filepath, project.writeSync());
          NODE
          xcodebuild -project ios/Lody.xcodeproj -target Lody -configuration Release \
            -sdk iphoneos -showBuildSettings -json > "$RUNNER_TEMP/signing-settings.json"
          jq -e --arg team "$APPLE_TEAM_ID" --arg profile "$IOS_PROFILE_UUID" \
            '[.[] | select(.target == "Lody") | .buildSettings] | length == 1 and
            all(.[]; .CODE_SIGN_STYLE == "Manual" and .CODE_SIGN_IDENTITY == "Apple Distribution"
              and .DEVELOPMENT_TEAM == $team and .PROVISIONING_PROFILE_SPECIFIER == $profile)' \
            "$RUNNER_TEMP/signing-settings.json"

      - name: Archive
        working-directory: ${{ env.MOBILE_DIR }}/ios
        run: |
          set -o pipefail
          command -v xcbeautify >/dev/null || brew install xcbeautify
          xcodebuild \
            -workspace Lody.xcworkspace \
            -scheme Lody \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Lody.xcarchive" \
            archive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" \
            MARKETING_VERSION="$MARKETING_VERSION" \
            | xcbeautify --renderer github-actions

      - name: Verify archive
        run: |
          set -euo pipefail
          APP="$RUNNER_TEMP/Lody.xcarchive/Products/Applications/Lody.app"
          test -d "$APP"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist")" = "$LODY_BUNDLE_ID"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$APP/Info.plist")" = "$BUILD_NUMBER"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$APP/Info.plist")" = "$MARKETING_VERSION"

          runtime_config="$(/usr/libexec/PlistBuddy -c 'Print :EXUpdatesRuntimeVersion' "$APP/Expo.plist")"
          if [ "$runtime_config" = 'file:fingerprint' ]; then
            runtime_version="$(tr -d '\r\n' < "$APP/EXUpdates.bundle/fingerprint")"
          else
            runtime_version="$runtime_config"
          fi
          if [ "$runtime_version" != "$EXPO_UPDATES_FINGERPRINT_OVERRIDE" ]; then
            echo "::error::Archive runtime $runtime_version does not match fingerprint $EXPO_UPDATES_FINGERPRINT_OVERRIDE."
            exit 1
          fi
          echo "Archived $LODY_BUNDLE_ID $MARKETING_VERSION ($BUILD_NUMBER) runtime $runtime_version"

      - name: Export IPA
        run: |
          set -euo pipefail
          cat > "$RUNNER_TEMP/exportOptions.plist" <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>export</string>
            <key>signingStyle</key><string>manual</string>
            <key>signingCertificate</key><string>Apple Distribution</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>$LODY_BUNDLE_ID</key><string>$IOS_PROFILE_UUID</string>
            </dict>
            <key>manageAppVersionAndBuildNumber</key><false/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Lody.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/exportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export"
          ipa="$(find "$RUNNER_TEMP/export" -maxdepth 1 -name '*.ipa' -print -quit)"
          test -n "$ipa"
          echo "IPA_PATH=$ipa" >> "$GITHUB_ENV"

      - name: Upload to TestFlight
        env:
          NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          notes="${NOTES:-}"
          if [ -z "$notes" ]; then
            notes="${{ github.sha }}"
          fi
          asc builds upload \
            --app "$LODY_BUNDLE_ID" \
            --ipa "$IPA_PATH" \
            --version "$MARKETING_VERSION" \
            --build-number "$BUILD_NUMBER" \
            --test-notes "$notes" \
            --locale en-US \
            --wait

      - name: Distribute to TestFlight group
        if: ${{ vars.TESTFLIGHT_GROUP != '' }}
        run: |
          asc builds add-groups \
            --app "$LODY_BUNDLE_ID" \
            --latest \
            --group "${{ vars.TESTFLIGHT_GROUP }}"

      - name: Record fingerprint baseline
        run: |
          printf '%s' "$EXPO_UPDATES_FINGERPRINT_OVERRIDE" > "$RUNNER_TEMP/fingerprint"

      - uses: actions/upload-artifact@v4
        with:
          name: ios-fingerprint
          path: ${{ runner.temp }}/fingerprint
          retention-days: 90

      - name: Clean up signing assets
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/ci.keychain-db" || true
          rm -f "$RUNNER_TEMP/dist.p12" "$RUNNER_TEMP"/AuthKey_*.p8
          rm -f "$RUNNER_TEMP/lody.mobileprovision" "$RUNNER_TEMP/lody-profile.plist"
          if [[ "${IOS_PROFILE_UUID:-}" =~ ^[0-9A-Fa-f-]{36}$ ]]; then
            rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
            rm -f "$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles/$IOS_PROFILE_UUID.mobileprovision"
          fi

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: submit
    if: ${{ always() }}
    steps:
      - name: Notify
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RESULT: ${{ needs.submit.result }}
          VERSION: ${{ needs.submit.outputs.marketing_version }}
          BUILD: ${{ needs.submit.outputs.build_number }}
          COMMIT: ${{ needs.submit.outputs.source_short }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN is not set; skipping notification."
            exit 0
          fi
          if [ "$RESULT" = success ]; then
            title="✅ Lody TestFlight 已上传 ${VERSION} (${BUILD})"
          else
            title="❌ Lody TestFlight 失败"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          text="$(printf '<b>%s</b>\n<b>提交</b>: <code>%s</code>\n<a href="%s">打开 GitHub Actions</a>' "$title" "$COMMIT" "$run_url")"
          jq -n --arg text "$text" \
            '{chat_id: "@order_usagi", text: $text, parse_mode: "HTML", disable_web_page_preview: true}' \
            | curl -sS -f -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H 'Content-Type: application/json' -d @-
