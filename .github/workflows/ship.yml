name: Ship (OTA or TestFlight)

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      notes:
        description: 'Optional notification notes'
        required: false
        type: string
      force_testflight:
        description: 'Skip OTA and archive a TestFlight build'
        required: false
        type: boolean
        default: false

concurrency:
  group: ship
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

env:
  MOBILE_DIR: apps/mobile

jobs:
  decide:
    name: Decide OTA or TestFlight
    runs-on: ubuntu-latest
    outputs:
      route: ${{ steps.route.outputs.route }}
      fingerprint: ${{ steps.fp.outputs.hash }}
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native runtime assets
        working-directory: ${{ env.MOBILE_DIR }}
        run: pnpm native:assets

      - name: Compute fingerprint
        id: fp
        working-directory: ${{ env.MOBILE_DIR }}
        run: |
          set -euo pipefail
          hash="$(../../node_modules/.bin/fingerprint fingerprint:generate --platform ios | jq -r .hash)"
          if [[ ! "$hash" =~ ^[a-zA-Z0-9]{16,}$ ]]; then
            echo "::error::Could not compute @expo/fingerprint hash."
            exit 1
          fi
          echo "hash=$hash" >> "$GITHUB_OUTPUT"
          echo "Fingerprint $hash"

      - name: Read fingerprint baseline
        id: baseline
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          artifact_id="$(gh api "repos/$GITHUB_REPOSITORY/actions/artifacts?name=ios-fingerprint&per_page=1" \
            --jq '[.artifacts[] | select(.expired == false) | .id][0] // ""')"
          baseline=""
          if [ -n "$artifact_id" ]; then
            gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$RUNNER_TEMP/fp.zip"
            baseline="$(unzip -p "$RUNNER_TEMP/fp.zip" fingerprint | tr -d '\r\n')"
          fi
          echo "hash=$baseline" >> "$GITHUB_OUTPUT"
          echo "Baseline ${baseline:-<none>}"

      - name: Choose route
        id: route
        env:
          FORCE: ${{ inputs.force_testflight }}
          CURRENT: ${{ steps.fp.outputs.hash }}
          BASELINE: ${{ steps.baseline.outputs.hash }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "push" ] || [ "$FORCE" = "true" ]; then
            echo "route=testflight" >> "$GITHUB_OUTPUT"
            echo "TestFlight requested"
          elif [ -z "$BASELINE" ]; then
            echo "route=testflight" >> "$GITHUB_OUTPUT"
            echo "No fingerprint baseline artifact; first ship is TestFlight"
          elif [ "$CURRENT" = "$BASELINE" ]; then
            echo "route=ota" >> "$GITHUB_OUTPUT"
            echo "Fingerprint matches baseline; shipping OTA"
          else
            echo "route=testflight" >> "$GITHUB_OUTPUT"
            echo "Fingerprint changed ($BASELINE -> $CURRENT); shipping TestFlight"
          fi

  ota:
    name: Publish OTA
    runs-on: ubuntu-latest
    needs: decide
    if: ${{ needs.decide.outputs.route == 'ota' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate native runtime assets
        working-directory: ${{ env.MOBILE_DIR }}
        run: pnpm native:assets

      - name: Publish update
        working-directory: ${{ env.MOBILE_DIR }}
        env:
          OTA_SERVER: ${{ secrets.OTA_SERVER }}
          OTA_API_KEY: ${{ secrets.OTA_API_KEY }}
          EXPO_UPDATES_FINGERPRINT_OVERRIDE: ${{ needs.decide.outputs.fingerprint }}
          EASC_SOURCE_COMMIT: ${{ github.sha }}
        run: |
          : "${OTA_SERVER:?OTA_SERVER is required}"
          : "${OTA_API_KEY:?OTA_API_KEY is required}"
          npx --yes easc@latest update --channel production --non-interactive

  testflight:
    name: TestFlight
    needs: decide
    if: ${{ needs.decide.outputs.route == 'testflight' }}
    uses: ./.github/workflows/release.yml
    with:
      notes: ${{ inputs.notes }}
      runtime_fingerprint: ${{ needs.decide.outputs.fingerprint }}
    secrets: inherit

  notify:
    name: Notify Telegram
    runs-on: ubuntu-latest
    needs: [decide, ota]
    if: ${{ always() && needs.decide.outputs.route == 'ota' }}
    steps:
      - name: Notify
        continue-on-error: true
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          RESULT: ${{ needs.ota.result }}
          FINGERPRINT: ${{ needs.decide.outputs.fingerprint }}
          NOTES: ${{ inputs.notes }}
        run: |
          if [ -z "${TELEGRAM_BOT_TOKEN:-}" ]; then
            echo "::notice::TELEGRAM_BOT_TOKEN is not set; skipping notification."
            exit 0
          fi
          if [ "$RESULT" = success ]; then
            title="✅ Lody OTA 已发布"
          else
            title="❌ Lody OTA 失败"
          fi
          run_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
          text="$(printf '<b>%s</b>\n<b>提交</b>: <code>%s</code>\n<b>Fingerprint</b>: <code>%s</code>\n%s\n<a href="%s">打开 GitHub Actions</a>' \
            "$title" "${GITHUB_SHA:0:7}" "$FINGERPRINT" "$NOTES" "$run_url")"
          jq -n --arg text "$text" \
            '{chat_id: "@order_usagi", text: $text, parse_mode: "HTML", disable_web_page_preview: true}' \
            | curl -sS -f -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
              -H 'Content-Type: application/json' -d @-
