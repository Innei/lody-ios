name = "lody"

[build]
command = ["xcodebuild", "-project", "Lody.xcodeproj", "-scheme", "LodyMac", "-configuration", "Debug",
           "-destination", "platform=macOS"]
prepare = ["pnpm", "prebuild"]
prepare_when_missing = "Lody.xcodeproj"
xctestrun = "LodyMac_*.xctestrun"
products = ["Debug/Lody.app", "Debug/LodyMacUITests-Runner.app", "Debug/PackageFrameworks"]

[test]
always = ["LodyMacTests"]
suite = "LodyMacUITests"
timeout = 1800

[test.cases]
sign-in = "SignInTests"
sidebar = "SidebarTests"
tabs = "TabsTests"
transcript = "TranscriptTests"
transcript-history = "TranscriptHistoryTests"
transcript-media = "TranscriptMediaTests"
attachments = "AttachmentsTests"
composer-new = "ComposerNewTests"
composer-reply = "ComposerReplyTests"
model-picker = "ComposerReplyTests/testModelPickerDesignStudies"
model-picker-reference = "ComposerReplyTests/testReferenceModelPickerKeepsSelectionSeparateFromHover"
model-picker-anchor = "ComposerReplyTests/testModelPickerExpandsWithoutChangingItsAnchorSide"
accent = "AccentTests"
offscreen = "OffscreenTests"
settings = "SettingsTests"

[reset]
processes = ["Lody"]
process_patterns = ["[L]odyMacUITests-Runner", "[r]un/files/run.mts"]
defaults = ["app.innei.lody.mac", "app.innei.lody.mac.uitests.xctrunner", "lody.mac.settings.catalog"]
paths = ["~/Library/Containers/app.innei.lody.mac*",
         "~/Library/Application Support/app.innei.lody.mac",
         "~/Library/Saved Application State/app.innei.lody.mac.savedState",
         "~/Library/Caches/app.innei.lody.mac",
         "~/Library/HTTPStorages/app.innei.lody.mac"]

[grants]
targets = ["app.innei.lody.mac"]

[grants.apps]
"app.innei.lody.mac" = []

[[extra]]
name = "in-process"
files = ["verification/mac/run.mts", "verification/mac/lib", "verification/mac/cases"]
node = true
command = "~/run/node --experimental-strip-types ~/run/files/run.mts --app ~/run/Debug/Lody.app --output {out}/in-process {cases}"
help = "also run the in-process suite (pnpm verify:mac) inside the guest"

[output]
dir = ".artifacts/mac-verify-vm"
